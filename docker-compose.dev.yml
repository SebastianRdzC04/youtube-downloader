services:
  backend:
    build: .
    container_name: youtube-downloader-dev
    restart: unless-stopped
    ports:
      - "50700:8000"
    env_file:
      - .env
    volumes:
      - downloads_tmp:/tmp/downloads
      - ./app:/app/app       # live-reload during dev (uvicorn --reload)
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  downloads_tmp:
